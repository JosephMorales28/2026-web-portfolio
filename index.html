<!DOCTYPE html>
<html lang="en-PH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="author" content="Joseph Anthony V. Morales">
    <meta name="description" content="Joseph's personal web portfolio showcasing his work in web development and graphic design.">
    <meta name="keywords" content="Joseph Morales, web portfolio, web development, graphic design, projects, resume">
    <meta name="language" content="English">
    <meta name="copyright" content="2026 Joseph Anthony V. Morales">
    <meta name="distribution" content="global">
    <link rel="icon" href="./img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preload" href="css/style.css" as="style"/>
    <link rel="preload" href="/img/joseph2026_300x300.webp" as="image" imaegsrcset="/img/joseph2026_150x150.webp 150w,/img/joseph2026_300x300.webp 300w" fetchpriority="high">
    <script src="js/script.js" defer></script>
    <script type="speculationrules">
       {
            "prefetch": [ 
                {
                    "urls":["/about.html", "/project.html","/service.html","/blog.html",/contact.html"],
                    "eagerness": "moderate" 
                } 
            ]
        }
    </script>
    <title>Joseph Web Portfolio 2026</title>
</head>
<body id="index">
    <header>
        <div class="logo">
            <picture>
                <source srcset="../img/logo.svg" type="image/svg+xml">
                <img src="../img/logo.svg" alt="logo" loading="lazy" fetchpriority="high">
            </picture>
        </div>
        <div>
             <ul class="header-link"></ul>
                <label for="Menu">
                       <select id="Menu" aria-labelledby="Menu">
                           <option value="index.html">Home</option>
                           <option value="about.html">About</option>
                           <option value="project.html">Projects</option>
                           <option value="service.html">Service</option>
                           <option value="blog.html">Blog</option>
                           <option value="contact.html">Contact</option>
                       </select>
                </label>
                <script>
                     document.getElementById("Menu").addEventListener("change", function () {
                        window.location.href = this.value;
                    });
                </script>
             <div class="btnResume">
                 <a href="Joseph Anthony V Morales resume 2026.docx" download>Resume Download</a>
             </div>
        </div>
      <script>
            const menu=["Home", "About", "Projects", "Service", "Blog", "Contact"];
            const link=["index.html", "about.html", "project.html", "service.html", "blog.html","contact.html"];
            
            document.querySelector(".header-link").innerHTML=menu.map((item,index)=>{
                return `<li><a href="${link[index]}">${item}</a></li>`;
            }).join("");
        </script>
    </header>
    <div id="app"></div>
    <aside>
        <form>
            <input type="search" placeholder="your email" id="search">
            <input type="submit" value="Email Send" id="submit">
        </form>
    </aside>
    <button>
        <a href="#index">&uarr; Back on top</a>
    </button>

    <div id="sample">
        <h1>branch testing and merging</h1>
        <p>testing redesign-css</p>
    </div>
<footer>
    <div class="footer"></div>
    <script type="module" src="./js/footer.js"></script>
</footer>
<script type="module" src="./js/index.js"></script>
</body>
</html>
